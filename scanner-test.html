<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skann ordrenummer (test)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5d6672; --line:#d9dde3; --ok:#12722e; --bad:#b3261e; --btn:#1a56db; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .banner { background:#b26a00; color:#fff; text-align:center; font-weight:700; letter-spacing:.06em; padding:6px; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 40px; }
  h1 { font-size:20px; margin:8px 0 10px; }
  h1 small { font-weight:400; color:var(--mute); font-size:12px; }
  h2 { font-size:16px; margin:0 0 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin:12px 0; }
  .cam { position:relative; width:100%; aspect-ratio:3/4; background:#000; border-radius:10px; overflow:hidden; }
  .cam video { width:100%; height:100%; object-fit:cover; display:block; }
  .guide { position:absolute; left:6%; right:6%; top:35%; height:30%; border:3px solid rgba(255,255,255,.9); border-radius:10px; box-shadow:0 0 0 999px rgba(0,0,0,.35); pointer-events:none; }
  .hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:#fff; font-size:14px; text-shadow:0 1px 3px #000; padding:0 12px; }
  #status { min-height:24px; margin:10px 0 0; font-size:15px; }
  #status.err { color:var(--bad); font-weight:600; }
  #status.ok { color:var(--ok); font-weight:600; }
  .btns { display:flex; gap:8px; margin:10px 0 0; flex-wrap:wrap; }
  button { min-height:48px; padding:0 16px; border:0; border-radius:8px; background:var(--btn); color:#fff; font:inherit; font-weight:600; flex:1; }
  button.sec { background:#e6e9ee; color:var(--ink); }
  button:disabled { opacity:.45; }
  [hidden] { display:none !important; }
  .big { font:700 40px/1.1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; margin:4px 0 6px; }
  .raw { font-size:13px; color:var(--mute); word-break:break-all; }
  .warn { color:#b26a00; font-size:14px; font-weight:600; }
  input[type=text] { width:100%; min-height:48px; font:inherit; font-size:20px; letter-spacing:.08em; padding:0 12px; border:1px solid var(--line); border-radius:8px; }
  textarea { width:100%; height:200px; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; border:1px solid var(--line); border-radius:8px; padding:8px; }
  summary { color:var(--mute); font-size:14px; }
  canvas#still { width:100%; max-height:200px; object-fit:contain; background:#000; border-radius:8px; margin-top:8px; display:none; }
</style>
</head>
<body>
<div class="banner">TEST – ikke produksjon</div>
<main>
  <h1>Skann ordrenummer <small id="ver"></small></h1>

  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="guide"></div>
    <div class="hint" id="hint">Legg strekkoden på bestillingsseddelen innenfor rammen</div>
  </div>
  <div id="status"></div>
  <div class="btns">
    <button id="start">Start kamera</button>
    <button id="stop" class="sec" hidden>Stopp</button>
  </div>

  <section id="result" hidden>
    <h2 id="resTitle">Lest</h2>
    <div class="big" id="resNum"></div>
    <div class="raw" id="resRaw"></div>
    <div class="warn" id="resWarn" hidden></div>
    <div class="btns">
      <button id="use">Bruk dette nummeret</button>
      <button id="again" class="sec">Skann på nytt</button>
    </div>
  </section>

  <section>
    <h2>Ta bilde i stedet</h2>
    <p class="raw" style="margin:0 0 8px">Åpner telefonens vanlige kamera-app. Fungerer selv om live-kamera er blokkert.</p>
    <input type="file" id="file" accept="image/*" capture="environment">
    <canvas id="still"></canvas>
  </section>

  <section>
    <h2>Skriv inn manuelt</h2>
    <input type="text" id="man" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="7 siffer" autocomplete="off">
    <div class="btns"><button id="manUse" disabled>Bruk</button></div>
  </section>

  <details>
    <summary>Teknisk logg</summary>
    <textarea id="log" readonly></textarea>
  </details>
</main>

<script src="zxing-library.min.js"></script>
<script>
(function () {
  'use strict';

  /* ===== Innstillinger ===== */
  var VERSION = 'scanner-2';
  // Apps Script-appen som skal motta ordrenummeret (kameratest nå, Service-kopien senere).
  var TARGET_URL = 'https://script.google.com/macros/s/AKfycbw0iiJf7shQhwVgPIq8xesssNitUGXMrFinqG7-uqL8FjUPfZUW-TUYvG6g67wWbYTK/exec';
  var PARAM = 'ordre';
  var ORDER_RE = /(^|\D)(\d{7})(?!\d)/;   // fritstående 7-sifret tall

  var $ = function (id) { return document.getElementById(id); };
  $('ver').textContent = VERSION;

  /* ===== Logg ===== */
  var logEl = $('log');
  function log(m) {
    var d = new Date();
    logEl.value += '[' + d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0') + '] ' + m + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.addEventListener('error', function (e) { log('window.onerror: ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) { log('unhandledrejection: ' + (e.reason && (e.reason.name + ': ' + e.reason.message) || e.reason)); });
  log(VERSION + ' | ' + navigator.userAgent);
  log('URL: ' + location.href + ' | secure=' + window.isSecureContext + ' | iframe=' + (window.self !== window.top));

  function setStatus(msg, cls) { var s = $('status'); s.textContent = msg || ''; s.className = cls || ''; }

  if (!window.ZXing) {
    setStatus('Kunne ikke laste skanner-biblioteket (zxing-library.min.js). Sjekk at filen ligger ved siden av denne siden.', 'err');
    log('FEIL: window.ZXing mangler');
  }

  /* ===== ZXing ===== */
  var reader = null;
  function getReader() {
    if (reader) return reader;
    var Z = window.ZXing, hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
      Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.EAN_13,
      Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE
    ]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    return reader;
  }
  function isExpectedMiss(e) {
    var Z = window.ZXing;
    return (Z.NotFoundException && e instanceof Z.NotFoundException) ||
           (Z.ChecksumException && e instanceof Z.ChecksumException) ||
           (Z.FormatException && e instanceof Z.FormatException);
  }
  function decodeCanvas(c) {
    var Z = window.ZXing;
    try {
      return getReader().decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));
    } catch (e) {
      if (!isExpectedMiss(e)) log('ZXing uventet feil: ' + (e && (e.message || e.name) || e));
      return null;
    }
  }

  /* ===== Resultat og videresending ===== */
  var candidate = null;
  function showResult(text, formatName, source) {
    var m = String(text).match(ORDER_RE);
    var digits = String(text).replace(/\D/g, '');
    candidate = m ? m[2] : (digits || null);
    log('LEST (' + source + '): "' + text + '" format=' + formatName + ' → kandidat=' + candidate);
    $('resNum').textContent = candidate || '—';
    $('resRaw').textContent = 'Rå strekkodeverdi: ' + text + (formatName ? ' (' + formatName + ')' : '');
    var warn = $('resWarn');
    if (m) { warn.hidden = true; $('resTitle').textContent = 'Ordrenummer funnet'; }
    else { warn.hidden = false; warn.textContent = 'Ikke et fritstående 7-sifret tall. Sjekk at dette stemmer før du bruker det.'; $('resTitle').textContent = 'Strekkode lest'; }
    $('use').disabled = !candidate;
    $('result').hidden = false;
    setStatus('Lest ✓', 'ok');
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function hideResult() { $('result').hidden = true; candidate = null; }
  function handOff(n) {
    var u = TARGET_URL + (TARGET_URL.indexOf('?') >= 0 ? '&' : '?') + PARAM + '=' + encodeURIComponent(n);
    log('Sender videre til ' + u);
    location.href = u;
  }
  $('use').addEventListener('click', function () { if (candidate) handOff(candidate); });
  $('again').addEventListener('click', function () { hideResult(); startCamera(); });

  /* ===== Live skanning ===== */
  var video = $('video'), stream = null, scanning = false, timer = null, attempt = 0;
  var work = document.createElement('canvas');

  /* Utsnitt-strategi. ZXing er svært følsom for hva som ellers er i samme bilde-rader
     (bordkant, tekst ved siden av strekkoden). Målt på 80 realistiske testscener:
     ett enkelt bånd i full bredde fant 0, mens 3 bånd × 5 horisontale vinduer fant 79.
     Vi prøver derfor ett utsnitt per bilderute og går gjennom hele lista. */
  var WINDOWS = [[0, 1], [0.12, 0.88], [0.2, 0.8], [0, 0.7], [0.3, 1]];
  function drawCrop(dst, src, srcW, srcH, fy, cy, x0, x1, maxW) {
    var sh = Math.round(srcH * fy);
    var sy = Math.min(Math.max(0, Math.round(srcH * cy - sh / 2)), srcH - sh);
    var sx = Math.round(srcW * x0), sw = Math.round(srcW * (x1 - x0));
    var scale = Math.min(1, maxW / sw);
    dst.width = Math.max(1, Math.round(sw * scale));
    dst.height = Math.max(1, Math.round(sh * scale));
    dst.getContext('2d', { willReadFrequently: true }).drawImage(src, sx, sy, sw, sh, 0, 0, dst.width, dst.height);
  }
  var LIVE_SPECS = [];
  [0.30, 0.55, 1.0].forEach(function (f) { WINDOWS.forEach(function (w) { LIVE_SPECS.push([f, 0.5, w[0], w[1]]); }); });

  function stopCamera() {
    scanning = false;
    clearTimeout(timer);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    $('start').hidden = false;
    $('stop').hidden = true;
  }
  function tick() {
    if (!scanning) return;
    if (video.readyState >= 2 && video.videoWidth) {
      var sp = LIVE_SPECS[attempt++ % LIVE_SPECS.length];
      drawCrop(work, video, video.videoWidth, video.videoHeight, sp[0], sp[1], sp[2], sp[3], 1280);
      var r = decodeCanvas(work);
      if (r) {
        var Z = window.ZXing;
        stopCamera();
        try { if (navigator.vibrate) navigator.vibrate(60); } catch (_) {}
        showResult(r.getText(), Z.BarcodeFormat[r.getBarcodeFormat()] || r.getBarcodeFormat(), 'live');
        return;
      }
    }
    timer = setTimeout(tick, 30);
  }
  function startCamera() {
    if (!window.ZXing) return;
    hideResult();
    setStatus('Ber om kamera …');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Live kamera støttes ikke i denne nettleseren. Bruk «Ta bilde i stedet».', 'err');
      return;
    }
    var p;
    try {
      p = navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
    } catch (e) { camError(e); return; }
    p.then(function (s) {
      stream = s;
      video.srcObject = s;
      return video.play();
    }).then(function () {
      var t = stream.getVideoTracks()[0], st = t.getSettings ? t.getSettings() : {};
      log('Kamera OK: "' + t.label + '" ' + st.width + 'x' + st.height);
      try {
        var caps = t.getCapabilities ? t.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
          t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        }
      } catch (_) {}
      scanning = true; attempt = 0;
      $('start').hidden = true; $('stop').hidden = false;
      setStatus('Skanner … hold strekkoden innenfor rammen.');
      tick();
    }).catch(camError);
  }
  function camError(e) {
    log('FEIL kamera: ' + (e && e.name) + ': ' + (e && e.message));
    stopCamera();
    var msg;
    switch (e && e.name) {
      case 'NotAllowedError': msg = 'Kameratilgang er blokkert. Tillat kamera for denne siden i nettleseren, eller bruk «Ta bilde i stedet».'; break;
      case 'NotFoundError': msg = 'Fant ikke noe kamera på denne enheten.'; break;
      case 'NotReadableError': msg = 'Kameraet er i bruk av en annen app. Lukk den og prøv igjen.'; break;
      default: msg = 'Kunne ikke starte kamera (' + (e && e.name) + '). Bruk «Ta bilde i stedet».';
    }
    setStatus(msg, 'err');
  }
  $('start').addEventListener('click', startCamera);
  $('stop').addEventListener('click', function () { stopCamera(); setStatus('Kamera stoppet.'); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && scanning) { stopCamera(); setStatus('Kamera stoppet (siden ble skjult).'); } });

  /* ===== Stillbilde (reserve) ===== */
  function rotated(src) {
    var c = document.createElement('canvas');
    c.width = src.height; c.height = src.width;
    var x = c.getContext('2d');
    x.translate(c.width / 2, c.height / 2);
    x.rotate(Math.PI / 2);
    x.drawImage(src, -src.width / 2, -src.height / 2);
    return c;
  }
  function stillPasses() {
    var fast = [], slow = [];
    [1.0, 0.55].forEach(function (f) { WINDOWS.forEach(function (w) { fast.push([f, 0.5, w[0], w[1]]); }); });
    for (var cy = 0.15; cy <= 0.851; cy += 0.14) { WINDOWS.forEach(function (w) { slow.push([0.3, cy, w[0], w[1]]); }); }
    return [fast, slow];
  }
  function decodeStill(canvas) {
    var orient = [canvas, rotated(canvas)], passes = stillPasses(), n = 0, tmp = document.createElement('canvas');
    for (var p = 0; p < passes.length; p++) {
      for (var o = 0; o < orient.length; o++) {
        for (var s = 0; s < passes[p].length; s++) {
          var sp = passes[p][s];
          n++;
          drawCrop(tmp, orient[o], orient[o].width, orient[o].height, sp[0], sp[1], sp[2], sp[3], 2400);
          var r = decodeCanvas(tmp);
          if (r) { log('Stillbilde: treff etter ' + n + ' forsøk (runde ' + (p + 1) + ', ' + (o ? '90°' : '0°') + ')'); return r; }
        }
      }
    }
    log('Stillbilde: ingen treff etter ' + n + ' forsøk');
    return null;
  }
  $('file').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f || !window.ZXing) return;
    stopCamera();
    hideResult();
    setStatus('Leser bildet …');
    log('Bilde: ' + f.name + ' ' + Math.round(f.size / 1024) + ' kB');
    var img = new Image();
    img.onload = function () {
      var max = 2400, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var cv = $('still');
      cv.width = Math.round(img.naturalWidth * sc);
      cv.height = Math.round(img.naturalHeight * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.style.display = 'block';
      setTimeout(function () {   // la «Leser …» rekke å vises
        var r = decodeStill(cv);
        if (r) showResult(r.getText(), window.ZXing.BarcodeFormat[r.getBarcodeFormat()] || r.getBarcodeFormat(), 'bilde');
        else setStatus('Fant ingen strekkode i bildet. Prøv igjen nærmere og skarpere, eller skriv inn manuelt.', 'err');
      }, 30);
    };
    img.onerror = function () { setStatus('Kunne ikke åpne bildet.', 'err'); log('FEIL: bildet kunne ikke lastes'); };
    img.src = URL.createObjectURL(f);
  });

  /* ===== Manuell inntasting ===== */
  $('man').addEventListener('input', function () {
    var v = this.value.replace(/\D/g, '').slice(0, 7);
    if (v !== this.value) this.value = v;
    $('manUse').disabled = v.length !== 7;
  });
  $('manUse').addEventListener('click', function () { var v = $('man').value; if (/^\d{7}$/.test(v)) handOff(v); });
})();
</script>
</body>
</html>
