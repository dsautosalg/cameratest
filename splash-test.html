<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Autosalg (TEST)</title>

<!-- TEST-KLONE av splashen. Lik produksjon, men:
     1) iframen peker på Kameratest-appen (ikke produksjonsappene)
     2) inneholder en skanner-overlay som Apps Script-appen kan be om via postMessage
     3) origin-sjekken er strammet inn (se isGoogleOrigin) -->

<link id="iconApple" rel="apple-touch-icon" sizes="180x180" href="https://verksted.autosalg.no/splash/splash-icon-180.png">
<link id="iconPng192" rel="icon" type="image/png" sizes="192x192" href="https://verksted.autosalg.no/splash/splash-icon-192.png">
<link id="iconPng512" rel="icon" type="image/png" sizes="512x512" href="https://verksted.autosalg.no/splash/splash-icon-512.png">
<link id="iconFav32" rel="icon" type="image/png" sizes="32x32" href="https://verksted.autosalg.no/splash/splash-favicon-32.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta id="metaAppleTitle" name="apple-mobile-web-app-title" content="Autosalg TEST">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D23A31">

<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#0c0c0d; }
  iframe { width:100%; height:100%; border:none; }

  #splash { position:fixed; inset:0; background:#0c0c0d; display:flex; align-items:center; justify-content:center; z-index:10; animation:splashFadeOut .35s ease forwards; animation-delay:1.1s; }
  @keyframes splashFadeOut { from { opacity:1; } to { opacity:0; pointer-events:none; } }
  #splash img { width:96px; height:96px; border-radius:22px; animation:splashIn .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes splashIn { 0% { transform:scale(.4); opacity:0; } 60% { transform:scale(1.08); opacity:1; } 100% { transform:scale(1); opacity:1; } }

  /* ---------- Skanner-overlay ---------- */
  #scanOverlay { position:fixed; inset:0; z-index:20; background:#000; color:#fff; font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  #scanOverlay[hidden] { display:none; }
  #scanVideo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .scanGuide { position:absolute; left:6%; right:6%; top:38%; height:24%; border:3px solid rgba(255,255,255,.92); border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,.4); pointer-events:none; }
  #scanTop { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:linear-gradient(#000a,#0000); }
  #scanTitle { font-weight:700; }
  #scanBottom { position:absolute; left:0; right:0; bottom:0; padding:14px 14px calc(env(safe-area-inset-bottom) + 14px); background:linear-gradient(#0000,#000b); display:flex; flex-direction:column; gap:10px; }
  #scanMsg { text-align:center; font-size:15px; min-height:22px; text-shadow:0 1px 3px #000; }
  #scanMsg.err { color:#ffb4ab; font-weight:600; }
  .scanBtn { display:block; text-align:center; min-height:48px; line-height:48px; padding:0 16px; border:0; border-radius:10px; background:#D23A31; color:#fff; font:inherit; font-weight:700; width:100%; }
  .scanBtn.sec { background:#ffffff26; }
  .scanBtn[hidden] { display:none; }
  #scanTop button { min-height:40px; padding:0 14px; border:0; border-radius:8px; background:#ffffff2e; color:#fff; font:inherit; font-weight:600; }
  #scanCard { position:absolute; left:16px; right:16px; top:50%; transform:translateY(-50%); background:#fff; color:#1b1f24; border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  #scanCard[hidden] { display:none; }
  #scanCard .big { font:700 34px/1.1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; }
  #scanCard .raw { font-size:13px; color:#5d6672; word-break:break-all; }
  #scanCard .warn { font-size:14px; color:#b26a00; font-weight:600; }
  #scanCard .scanBtn.sec { background:#e6e9ee; color:#1b1f24; }
</style>
</head>
<body>
  <div id="splash">
    <img id="splashLogo" src="https://verksted.autosalg.no/splash/splash-icon-512.png" alt="">
  </div>

  <!-- TEST: peker på Service-testklonen (service-test/Code.gs + Index.html).
       Bytt SETT_INN_TEST_DEPLOYMENT_URL_HER med exec-URL-en du får når du deployer
       den nye kopien i Apps Script (Deploy > New deployment > Web app). -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzzIb1HYQEsvRHJ9GM_P4mwKyRMUyXq0fCjRCVelws1A9KU6Z-3HaxsJstINJBy908CuQ/exec"
    allow="camera; microphone; screen-wake-lock">
  </iframe>

  <div id="scanOverlay" hidden>
    <video id="scanVideo" playsinline muted></video>
    <div class="scanGuide"></div>
    <div id="scanTop"><span id="scanTitle">Skann ordrenummer</span><button id="scanCancel">Avbryt</button></div>
    <div id="scanBottom">
      <div id="scanMsg"></div>
      <button class="scanBtn" id="scanStart" hidden>Start kamera</button>
      <label class="scanBtn sec">Ta bilde i stedet<input type="file" id="scanFile" accept="image/*" capture="environment" hidden></label>
    </div>
    <div id="scanCard" hidden>
      <div id="cardTitle" style="font-weight:700">Strekkode lest</div>
      <div class="big" id="cardNum"></div>
      <div class="raw" id="cardRaw"></div>
      <div class="warn">Ikke et fritstående 7-sifret tall. Sjekk at dette stemmer.</div>
      <button class="scanBtn" id="cardUse">Bruk likevel</button>
      <button class="scanBtn sec" id="cardAgain">Skann på nytt</button>
    </div>
  </div>

  <script src="zxing-library.min.js"></script>
  <script>
  (function () {
    'use strict';

    /* Kun meldinger fra Google-domener (Apps Script-appen kjører på *.googleusercontent.com,
       omslaget på script.google.com). Strammere enn tidligere indexOf('google'), som også
       slipper inn f.eks. https://google.evil.com. */
    function isGoogleOrigin(o) {
      return typeof o === 'string' && /^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(o);
    }

    /* ================= Eksisterende navigasjon (uendret bortsett fra origin-sjekken) ================= */
    var APP_META = {
      verksted: {
        title: 'Saksbilder',
        icon180: 'https://verksted.autosalg.no/verksted/verksted-icon-180.png',
        icon192: 'https://verksted.autosalg.no/verksted/verksted-icon-192.png',
        icon512: 'https://verksted.autosalg.no/verksted/verksted-icon-512.png',
        favicon32: 'https://verksted.autosalg.no/verksted/verksted-favicon-32.png'
      },
      kundemottak: {
        title: 'Skadebilder',
        icon180: 'https://verksted.autosalg.no/kundemottak/kundemottak-icon-180.png',
        icon192: 'https://verksted.autosalg.no/kundemottak/kundemottak-icon-192.png',
        icon512: 'https://verksted.autosalg.no/kundemottak/kundemottak-icon-512.png',
        favicon32: 'https://verksted.autosalg.no/kundemottak/kundemottak-favicon-32.png'
      },
      karosseri: {
        title: 'Karosseri',
        icon180: 'https://verksted.autosalg.no/karosseri/karosseri-icon-180.png',
        icon192: 'https://verksted.autosalg.no/karosseri/karosseri-icon-192.png',
        icon512: 'https://verksted.autosalg.no/karosseri/karosseri-icon-512.png',
        favicon32: 'https://verksted.autosalg.no/karosseri/karosseri-favicon-32.png'
      }
    };

    window.addEventListener('message', function (ev) {
      if (!ev.data || ev.data.type !== 'autosalg-nav' || typeof ev.data.url !== 'string') return;
      if (!isGoogleOrigin(ev.origin)) return;

      var appFrame = document.getElementById('appFrame');
      try {
        appFrame.contentWindow.location.replace(ev.data.url);
      } catch (e) {
        appFrame.src = ev.data.url; // reserveløsning hvis noe uventet skjer
      }

      var meta = APP_META[ev.data.key];
      if (meta) {
        document.title = meta.title;
        document.getElementById('metaAppleTitle').setAttribute('content', meta.title);
        document.getElementById('iconApple').href = meta.icon180;
        document.getElementById('iconPng192').href = meta.icon192;
        document.getElementById('iconPng512').href = meta.icon512;
        document.getElementById('iconFav32').href = meta.favicon32;
      }
    });

    /* ================= Skanner =================
       Protokoll (Apps Script-appen → splash, via window.top.postMessage):
         { type:'autosalg-scan-request', id }
       Svar (splash → appen, til ev.source med ev.origin):
         { type:'autosalg-scan-ack',    id }
         { type:'autosalg-scan-result', id, value:'3089974', raw:'…', format:'CODE_128' }
         { type:'autosalg-scan-cancel', id, reason:'user' | 'replaced' | '<feilnavn>' }
       Splash-siden eier kameraet (ekte origin), så Googles iframe-sandkasse er ikke i veien,
       og appen i iframen beholder all tilstand: ingen omlasting. */
    var ORDER_RE = /(^|\D)(\d{7})(?!\d)/;
    var $ = function (id) { return document.getElementById(id); };
    var S = { session: null, stream: null, scanning: false, timer: null, attempt: 0, lastError: null, cand: null };
    var video = $('scanVideo');
    var work = document.createElement('canvas');

    /* Utsnitt-strategi (målt: 79/80 realistiske scener mot 0/80 for ett bånd i full bredde) */
    var WINDOWS = [[0, 1], [0.12, 0.88], [0.2, 0.8], [0, 0.7], [0.3, 1]];
    function drawCrop(dst, src, srcW, srcH, fy, cy, x0, x1, maxW) {
      var sh = Math.round(srcH * fy);
      var sy = Math.min(Math.max(0, Math.round(srcH * cy - sh / 2)), srcH - sh);
      var sx = Math.round(srcW * x0), sw = Math.round(srcW * (x1 - x0));
      var scale = Math.min(1, maxW / sw);
      dst.width = Math.max(1, Math.round(sw * scale));
      dst.height = Math.max(1, Math.round(sh * scale));
      dst.getContext('2d', { willReadFrequently: true }).drawImage(src, sx, sy, sw, sh, 0, 0, dst.width, dst.height);
    }
    var LIVE_SPECS = [];
    [0.30, 0.55, 1.0].forEach(function (f) { WINDOWS.forEach(function (w) { LIVE_SPECS.push([f, 0.5, w[0], w[1]]); }); });

    var reader = null;
    function getReader() {
      if (reader) return reader;
      var Z = window.ZXing, hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      reader = new Z.MultiFormatReader();
      reader.setHints(hints);
      return reader;
    }
    function decodeCanvas(c) {
      var Z = window.ZXing;
      try {
        return getReader().decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));
      } catch (e) {
        return null; // ikke funnet / sjekksumfeil er normalt mens vi leter
      }
    }

    function reply(msg) {
      var s = S.session;
      if (!s) return;
      var m = { id: s.id };
      for (var k in msg) m[k] = msg[k];
      try { s.source.postMessage(m, s.origin); } catch (e) { /* mottaker borte */ }
    }
    function setMsg(t, err) { var m = $('scanMsg'); m.textContent = t || ''; m.className = err ? 'err' : ''; }

    function stopStream() {
      S.scanning = false;
      clearTimeout(S.timer);
      if (S.stream) { S.stream.getTracks().forEach(function (t) { t.stop(); }); S.stream = null; }
      video.srcObject = null;
    }
    function closeOverlay() {
      stopStream();
      $('scanCard').hidden = true;
      $('scanOverlay').hidden = true;
      S.session = null;
    }
    function cancel() {
      reply({ type: 'autosalg-scan-cancel', reason: S.lastError || 'user' });
      closeOverlay();
    }
    function finish(value, raw, format) {
      reply({ type: 'autosalg-scan-result', value: value, raw: raw, format: format });
      closeOverlay();
    }

    function tick() {
      if (!S.scanning) return;
      if (video.readyState >= 2 && video.videoWidth) {
        var sp = LIVE_SPECS[S.attempt++ % LIVE_SPECS.length];
        drawCrop(work, video, video.videoWidth, video.videoHeight, sp[0], sp[1], sp[2], sp[3], 1280);
        var r = decodeCanvas(work);
        if (r) { onFound(r); return; }
      }
      S.timer = setTimeout(tick, 30);
    }
    function onFound(r) {
      var Z = window.ZXing;
      stopStream();
      try { if (navigator.vibrate) navigator.vibrate(60); } catch (_) {}
      var text = r.getText(), fmt = Z.BarcodeFormat[r.getBarcodeFormat()] || String(r.getBarcodeFormat());
      var m = String(text).match(ORDER_RE);
      if (m) { finish(m[2], text, fmt); return; }
      var digits = String(text).replace(/\D/g, '');
      S.cand = { value: digits, raw: text, format: fmt };
      $('cardNum').textContent = digits || '—';
      $('cardRaw').textContent = 'Rå strekkodeverdi: ' + text + ' (' + fmt + ')';
      $('cardUse').hidden = !digits;
      $('scanCard').hidden = false;
    }

    function startCamera() {
      stopStream();
      $('scanCard').hidden = true;
      $('scanStart').hidden = true;
      setMsg('Starter kamera …');
      var p;
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { var ns = new Error('x'); ns.name = 'NotSupportedError'; throw ns; }
        p = navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      } catch (e) { camError(e); return; }
      p.then(function (s) {
        S.stream = s;
        video.srcObject = s;
        return video.play();
      }).then(function () {
        try {
          var t = S.stream.getVideoTracks()[0], caps = t.getCapabilities ? t.getCapabilities() : {};
          if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        } catch (_) {}
        S.lastError = null;
        S.scanning = true; S.attempt = 0;
        setMsg('Hold strekkoden innenfor rammen');
        tick();
      }).catch(camError);
    }
    var tapped = false;
    function camError(e) {
      stopStream();
      S.lastError = (e && e.name) || 'CameraError';
      $('scanStart').hidden = false;
      $('scanStart').textContent = 'Start kamera';
      if (S.lastError === 'NotAllowedError' && !tapped) {
        setMsg('Trykk «Start kamera» for å gi tilgang.', true);
      } else if (S.lastError === 'NotAllowedError') {
        setMsg('Kameratilgang er blokkert for denne siden. Bruk «Ta bilde i stedet».', true);
      } else if (S.lastError === 'NotFoundError') {
        setMsg('Fant ikke noe kamera. Bruk «Ta bilde i stedet».', true);
      } else if (S.lastError === 'NotReadableError') {
        setMsg('Kameraet er i bruk av en annen app. Lukk den og prøv igjen.', true);
      } else {
        setMsg('Kunne ikke starte kamera (' + S.lastError + '). Bruk «Ta bilde i stedet».', true);
      }
    }
    $('scanStart').addEventListener('click', function () { tapped = true; startCamera(); });
    $('scanCancel').addEventListener('click', cancel);
    $('cardUse').addEventListener('click', function () { if (S.cand) finish(S.cand.value, S.cand.raw, S.cand.format); });
    $('cardAgain').addEventListener('click', startCamera);
    document.addEventListener('visibilitychange', function () { if (document.hidden && S.scanning) { stopStream(); $('scanStart').hidden = false; setMsg('Kamera stoppet. Trykk «Start kamera».'); } });

    /* --- Stillbilde-reserve --- */
    function rotated(src) {
      var c = document.createElement('canvas');
      c.width = src.height; c.height = src.width;
      var x = c.getContext('2d');
      x.translate(c.width / 2, c.height / 2); x.rotate(Math.PI / 2); x.drawImage(src, -src.width / 2, -src.height / 2);
      return c;
    }
    function decodeStill(canvas) {
      var fast = [], slow = [];
      [1.0, 0.55].forEach(function (f) { WINDOWS.forEach(function (w) { fast.push([f, 0.5, w[0], w[1]]); }); });
      for (var cy = 0.15; cy <= 0.851; cy += 0.14) { WINDOWS.forEach(function (w) { slow.push([0.3, cy, w[0], w[1]]); }); }
      var passes = [fast, slow], orient = [canvas, rotated(canvas)], tmp = document.createElement('canvas');
      for (var p = 0; p < passes.length; p++) for (var o = 0; o < 2; o++) for (var s = 0; s < passes[p].length; s++) {
        var sp = passes[p][s];
        drawCrop(tmp, orient[o], orient[o].width, orient[o].height, sp[0], sp[1], sp[2], sp[3], 2400);
        var r = decodeCanvas(tmp);
        if (r) return r;
      }
      return null;
    }
    $('scanFile').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!f) return;
      stopStream();
      setMsg('Leser bildet …');
      var img = new Image();
      img.onload = function () {
        var sc = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        setTimeout(function () {
          var r = decodeStill(cv);
          if (r) onFound(r);
          else { setMsg('Fant ingen strekkode i bildet. Prøv nærmere og skarpere, eller avbryt og skriv inn manuelt.', true); $('scanStart').hidden = false; }
        }, 30);
      };
      img.onerror = function () { setMsg('Kunne ikke åpne bildet.', true); };
      img.src = URL.createObjectURL(f);
    });

    /* --- Forespørsel fra appen --- */
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object' || d.type !== 'autosalg-scan-request') return;
      if (!isGoogleOrigin(ev.origin) || !ev.source) return;
      if (S.session) { reply({ type: 'autosalg-scan-cancel', reason: 'replaced' }); closeOverlay(); }
      S.session = { source: ev.source, origin: ev.origin, id: String(d.id || '').slice(0, 64) };
      S.lastError = null; tapped = false;
      reply({ type: 'autosalg-scan-ack' });
      if (!window.ZXing) { S.lastError = 'ZXingMissing'; }
      $('scanOverlay').hidden = false;
      if (!window.ZXing) { setMsg('Skanner-biblioteket mangler (zxing-library.min.js).', true); return; }
      startCamera();
    });
  })();
  </script>

</body>
</html>
